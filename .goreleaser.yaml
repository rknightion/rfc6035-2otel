version: 2
project_name: rfc6035-2otel
report_sizes: true
gomod:
  proxy: true
builds:
  - id: rfc6035-2otel
    main: ./cmd/rfc6035-2otel
    binary: rfc6035-2otel
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.buildDate={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
release:
  draft: false
  # Without this, RC tags (vX.Y.Z-rc.N) publish as full GitHub releases and steal
  # "Latest" from the actual stable release. goreleaser marks any tag containing a
  # hyphen as a prerelease automatically.
  prerelease: auto
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
sboms:
  - artifacts: archive
changelog:
  use: github
  sort: asc
