apiVersion: 1
groups:
  - orgId: 1
    name: rfc6035-2otel
    folder: rfc6035-2otel
    interval: 1m
    rules:
      - uid: rfc6035-2otel-high-packet-loss
        title: High packet loss in arriving RFC 6035 reports
        condition: A
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          pipeline: rfc6035-2otel
          severity: warning
          source: rfc6035-2otel
        annotations:
          summary: High packet loss in arriving RFC 6035 reports
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              datasource: {type: prometheus, uid: grafanacloud-prom}
              editorMode: code
              expr: '(sum(increase(rfc6035_2otel_reports_total[5m])) > 0) and histogram_quantile(0.95, sum by (le) (rate(rfc6035_call_packet_loss_bucket[5m]))) > 0.05'
              instant: true
              refId: A
      - uid: rfc6035-2otel-export-failures
        title: RFC 6035 telemetry export is failing
        condition: A
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          pipeline: rfc6035-2otel
          severity: warning
          source: rfc6035-2otel
        annotations:
          summary: RFC 6035 telemetry export is failing
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              datasource: {type: prometheus, uid: grafanacloud-prom}
              editorMode: code
              expr: 'increase(rfc6035_2otel_export_failures_total[5m]) > 0'
              instant: true
              refId: A
