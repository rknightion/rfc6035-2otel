name: Helm
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "justfile"
      - ".github/workflows/helm.yml"
  pull_request:
permissions:
  contents: read
concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true
env:
  CHART_DIR: charts/rfc6035-2otel
jobs:
  lint-template:
    name: lint and render chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just helm-lint </dev/null
      - run: just helm-docs-check </dev/null
  # This chart published to GHCR with no schema validation against the real
  # Kubernetes API schemas at all — `lint-template` above only ran helm's own
  # lint plus a bare template render, never a kubeconform check. No kubeVersion
  # floor is declared in Chart.yaml, so this validates against the reusable's
  # own default floor (1.29.0). No named `helm template` variant exists
  # anywhere in this repo, so only the bare default render is validated.
  helm-schema-validate:
    name: helm schema validate (kubeconform)
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@97f4a7ad0cd1ddd83562a30b9061ef8295242405 # v1.14.0
    with:
      chart-path: charts/rfc6035-2otel
      kubernetes-versions: "1.29.0"
  helm-success:
    name: Helm gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-template, helm-schema-validate]
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
