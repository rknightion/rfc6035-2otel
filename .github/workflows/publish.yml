name: publish
on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    name: resolve build metadata
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.build.outputs.commit }}
      build_date: ${{ steps.build.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - id: build
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
  image:
    name: publish image and chart
    needs: metadata
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: write # publishes release metadata through the reusable workflow
      packages: write # pushes OCI images and charts
      id-token: write # obtains keyless signing credentials
      attestations: write # publishes provenance attestations
      security-events: write # uploads container scan results
    uses: rknightion/.github/.github/workflows/container-publish.yml@9c3981da69a2aa4eecd99e5740335219fd8c6a00 # v1.9.10
    with:
      release-tag: ${{ inputs.release_tag }}
      dockerfile: Dockerfile
      helm-chart-path: charts/rfc6035-2otel
      build-args: |
        COMMIT=${{ needs.metadata.outputs.commit }}
        BUILD_DATE=${{ needs.metadata.outputs.build_date }}
