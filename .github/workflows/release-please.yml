name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: bao
        uses: rknightion/.github/.github/actions/broker-token@b9ab5f80961f2c29c47a8d7d5dff112b6551169c # untagged resolver fix; zizmor: ignore[ref-version-mismatch]
        with:
          permission-set: release-please-rfc6035-2otel
          role: release-please-rfc6035-2otel
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.bao.outputs.token }}
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
  edge:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      release_tag: ""
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    uses: rknightion/.github/.github/workflows/binaries.yml@d1c590b295b9d7f2535fadc7bc5e74f2eddbd512 # main
    with:
      release-tag: ${{ needs.release-please.outputs.tag_name }}
      install-cosign: true
      goreleaser-args: "release --clean --skip=docker"
      pre-cmd: "go install github.com/anchore/syft/cmd/syft@v1.42.3"
